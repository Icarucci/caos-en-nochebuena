<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caos en Nochebuena</title>
  <script src="/sala.js" defer></script>
</head>
<body>
  <h1>Caos en Nochebuena</h1>

  <!-- Pantalla inicial para crear una sala o entrar con un código. -->
  <section>
    <button id="crear-sala" type="button">Crear sala privada</button>

    <form id="formulario-ingreso">
      <label for="codigo">Código de sala</label>
      <input id="codigo" name="codigo" required
             maxlength="6" pattern="[A-Za-z0-9]{6}"
             placeholder="A1B2C3" autocomplete="off">
      <button type="submit">Unirse con código</button>
    </form>

    <p id="estado" role="status">Creá una sala o ingresá un código.</p>
  </section>

  <!-- La mesa se muestra cuando Java confirma el ingreso. -->
  <section id="mesa" hidden>
    <h2 id="titulo-sala"></h2>
    <p id="cantidad-jugadores" role="status"></p>
    <button id="tirar" type="button" disabled>Tirar Bola de nieve</button>
    <h3>Actividad</h3>
    <ul id="actividad"></ul>
  </section>
</body>
</html>
