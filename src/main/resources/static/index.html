<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caos en Nochebuena</title>
  <script src="/sala.js" defer></script>
</head>
<body>
  <h1>Caos en Nochebuena</h1>
  <p id="estado" role="status">Creá una sala o ingresá un código.</p>

  <!-- El mismo nombre se usa para crear una sala o entrar con un código. -->
  <section id="acceso">
    <label for="nombre">Tu nombre</label>
    <input id="nombre" name="nombre" form="formulario-ingreso"
           required maxlength="20" placeholder="Ingresar nombre...">
    <!-- El anfitrión elige cómo podrán encontrar e ingresar a su sala. -->
    <label for="tipo-sala">Tipo de sala</label>
    <select id="tipo-sala">
      <option value="PRIVADA">Privada — ingreso con código</option>
      <option value="PUBLICA">Pública — aparece en el listado</option>
    </select>

    <button id="crear-sala" type="button">Crear sala</button>

    <form id="formulario-ingreso">
      <label for="codigo">Código de sala</label>
      <input id="codigo" name="codigo" required maxlength="6"
             pattern="[A-Za-z0-9]{6}" placeholder="A1B2C3" autocomplete="off">
      <button type="submit">Unirse con código</button>
    </form>
  </section>

  <section id="salas-publicas">
    <h2>Salas públicas</h2>
    <button id="actualizar-salas" type="button">Actualizar salas</button>
    <p id="estado-salas" role="status"></p>
    <ul id="lista-salas-publicas"></ul>
  </section>

  <!-- La recuperación sirve tanto antes como después de iniciar la partida. -->
  <section id="recuperar-partida" hidden>
    <h2 id="titulo-recuperacion"></h2>
    <p id="detalle-partida"></p>
    <button id="reconectar" type="button">Reconectar</button>
    <button id="abandonar" type="button">Abandonar</button>
  </section>

  <section id="mesa" hidden>
    <h2 id="titulo-sala"></h2>
    <p id="cantidad-jugadores" role="status"></p>
    <ul id="lista-jugadores" aria-label="Jugadores"></ul>

    <!-- El servidor determina cuál de estas dos áreas se muestra. -->
    <!-- El botón de inicio solo aparece durante la espera. -->
    <section id="lobby">
      <button id="iniciar-partida" type="button" disabled>
        Iniciar partida
      </button>
    </section>

    <section id="partida" hidden>
      <!-- Esta ficha muestra únicamente el rol recibido por esta pestaña. -->
      <section id="rol-privado" hidden>
        <h3 id="rol-nombre"></h3>
        <p id="rol-objetivo"></p>
        <p id="rol-vidas"></p>
        <!-- El servidor decide cuándo todos pueden pasar a la siguiente etapa. -->
        <button id="confirmar-rol" type="button">Continuar</button>
        <p id="estado-confirmacion" role="status"></p>
        <!-- Las opciones se muestran cuando todos confirmaron su rol. -->
        <section id="seleccion-habilidad" hidden>
          <h3>Elegí tu habilidad</h3>
          <div id="opciones-habilidad"></div>
          <p id="habilidad-confirmada" role="status"></p>
        </section>
      </section>
      <!-- Informa la eliminación sin ocultar el resto de la partida. -->
      <p id="estado-participacion" role="status" hidden></p>
      <!-- Controles del turno actual. -->
      <section id="controles-turno" hidden>
        <h3 id="detalle-turno"></h3>

        <p>Tiempo restante: <span id="tiempo-turno">01:00</span></p>

        <button id="terminar-turno" type="button" disabled>
          Terminar turno
        </button>
      </section>
      <!-- Solo se habilita cuando el servidor permite lanzar una bola. -->
      <section id="controles-ataque" hidden>
        <h3>Lanzar Bola de nieve</h3>

        <label for="bola-elegida">Carta</label>
        <select id="bola-elegida" disabled></select>

        <label for="objetivo-ataque">Objetivo</label>
        <select id="objetivo-ataque" disabled></select>

        <button id="tirar" type="button" disabled>
          Tirar Bola de nieve
        </button>
      </section>

      <!-- Todos ven el ataque; solo el objetivo puede responder. -->
      <section id="ataque-pendiente" hidden>
        <h3>Bola de nieve en juego</h3>
        <p id="detalle-ataque"></p>

        <p>
          Tiempo para responder:
          <span id="tiempo-respuesta">01:00</span>
        </p>

        <div id="opciones-respuesta" hidden>
          <label for="defensa-elegida">Tu defensa</label>
          <select id="defensa-elegida" disabled></select>

          <button id="usar-defensa" type="button" disabled>
            Usar defensa
          </button>

          <!-- No consume una carta: acepta perder una vida. -->
          <button id="recibir-danio" type="button" disabled>
            Recibir daño
          </button>
        </div>
      </section>

      <!-- Cada navegador recibe únicamente el contenido de su propia mano. -->
      <section id="zona-cartas" hidden>
        <p id="estado-mazo"></p>
        <h3>Tu mano</h3>
        <ul id="mano-propia"></ul>
        <!-- Explica cuántas cartas hay que descartar al finalizar. -->
        <p id="aviso-descarte" role="status"></p>
      </section>

        </section>

    <!-- Compartimos el mismo chat durante la espera y durante la partida.
         Aquí también aparecerán las conexiones y las acciones del juego. -->
    <section id="conversacion-sala" aria-labelledby="titulo-chat">
      <h3 id="titulo-chat">Chat y actividad</h3>

      <!-- JavaScript agregará los mensajes en el orden recibido. -->
      <ul id="chat" aria-live="polite" aria-relevant="additions"></ul>

      <form id="formulario-chat">
        <label for="mensaje-chat">Mensaje</label>
        <input id="mensaje-chat" required maxlength="200"
               autocomplete="off">
        <button type="submit">Enviar</button>
      </form>
    </section>
  </section>

  <!-- Permanece visible aunque el servidor cierre la conexión de la partida. -->
  <dialog id="resultado-partida" aria-labelledby="titulo-resultado">
    <h2 id="titulo-resultado">Partida finalizada</h2>
    <p id="resumen-resultado"></p>
    <p id="resultado-personal"></p>
    <button id="salir-partida" type="button">Salir</button>
  </dialog>
</body>
</html>
